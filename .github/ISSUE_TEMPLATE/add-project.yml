name: "Add a project"
description: "Add an AI open source project to the Opensource AI Landscape"
title: "[ADD] "
labels: ["add-project"]
body:
  - type: markdown
    attributes:
      value: |
        Request an AI open source project for the landscape.
        When a maintainer comments `/approve`, a workflow adds the project automatically.

  - type: input
    id: github_url
    attributes:
      label: "GitHub Repository URL"
      description: "Enter the URL of the GitHub repository to add. For a model or dataset that is only on HuggingFace, you can enter the HuggingFace URL. In that case, you must fill in the description below."
      placeholder: "https://github.com/owner/repo"
    validations:
      required: true

  - type: dropdown
    id: module_id
    attributes:
      label: "Module"
      description: "Select the module that the project belongs to"
      options:
        - "infra-computing (Infra & Computing)"
        - "data-storage (Data & Storage)"
        - "model-algorithm (Model & Algorithm)"
        - "training-inference (Training & Inference)"
        - "platform-mlops (Platform & MLOps)"
        - "application-service (Application & Service)"
        - "security-governance (Security & Governance)"
    validations:
      required: true

  - type: dropdown
    id: category_id
    attributes:
      label: "Category"
      description: "Select the category of the project"
      options:
        # Infra & Computing
        - "container-orchestration (Container & Orchestration)"
        - "distributed-cloud (Distributed Cloud Infra)"
        - "ai-accelerator (AI Accelerator (GPU/NPU))"
        - "sustainable-ai (Sustainable AI Infra)"
        # Data & Storage
        - "vector-db (Vector Database)"
        - "data-quality (Data Quality)"
        - "data-labeling (Data Labeling)"
        - "synthetic-data (Synthetic Data)"
        - "datasets-tools (Datasets & Tools)"
        - "catalog-lineage (Catalog & Lineage)"
        - "etl-workflow (ETL & Workflow)"
        # Model & Algorithm
        - "llm (Large Language Model (LLM))"
        - "vision-model (Vision Model)"
        - "embedding-model (Embedding Model)"
        - "multimodal (Multimodal Model)"
        - "time-series-model (Time Series Model)"
        - "decision-model (Decision Model)"
        # Training & Inference
        - "feature-store (Feature Store)"
        - "experiment-tracking (Experiment Tracking)"
        - "inference-optimization (Inference Optimization)"
        - "model-compression (Model Compression)"
        - "fine-tuning (Fine-tuning)"
        - "automl-hpo (AutoML / HPO)"
        - "federated-learning (Federated Learning)"
        - "distributed-training (Distributed Training)"
        - "reinforcement-learning (Reinforcement Learning)"
        - "deep-learning-framework (Deep Learning Framework)"
        # Platform & MLOps
        - "agent-orchestration (Agent Orchestration)"
        - "llmops-observability (LLMOps & Observability)"
        - "testing-evaluation (Testing & Evaluation)"
        - "interoperability (Agent & Tool Interop)"
        - "memory-knowledge (Memory & Knowledge Graph)"
        - "rag-graphrag (RAG & GraphRAG)"
        - "prompt-management (Prompt Management)"
        - "on-device-runtime (On-device Runtime)"
        - "model-serving (Model Serving)"
        # Application & Service
        - "ai-chatbot (AI Chatbot & Assistant)"
        - "content-generation (Content Generation)"
        - "recommendation-search (Recommendation & Search)"
        - "industry-solutions (Industry AI Solutions)"
        - "autonomous-agent (Autonomous Agent)"
        # Security & Governance
        - "alignment (AI Alignment)"
        - "security-testing (Security Testing & Red Team)"
        - "guardrails (Guardrails & Policy Engine)"
        - "xai (Explainable AI (XAI))"
        - "fairness-bias (Fairness & Bias Detection)"
        - "data-privacy (Data Privacy)"
        - "governance (AI Governance)"
    validations:
      required: true

  - type: textarea
    id: description_override
    attributes:
      label: "Description (optional)"
      description: "Enter an English description to use instead of the GitHub repository description"
      placeholder: "If you leave this empty, the workflow uses the description of the GitHub repository"
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "This is an open source project directly related to AI"
          required: true
        - label: "The GitHub repository (or HuggingFace page) is public"
          required: true
        - label: "The module and category selected above are correct"
          required: true
