name: Add Project from Issue

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: "add-project"
  cancel-in-progress: false

jobs:
  add-project:
    # Only run on issue comments (not PR comments) that contain /approve
    if: |
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '/approve') &&
      contains(github.event.issue.labels.*.name, 'add-project') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Parse issue body
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body ?? ''

            // Extract github_url from body (template format)
            const urlMatch = body.match(/### GitHub 저장소 URL\s*\n+(.+)/m)
            let githubUrl = urlMatch?.[1]?.trim()

            // Fallback: legacy body formats like "- **GitHub URL**: https://..."
            if (!githubUrl) {
              const legacyUrl = body.match(/GitHub\s*URL[^\n]*?(https?:\/\/github\.com\/[^\s<>)\]]+)/i)
              githubUrl = legacyUrl?.[1]?.trim()
            }

            // Extract module_id (first word before space/parenthesis)
            const moduleMatch = body.match(/### 분류 \(모듈\)\s*\n+([^\s(]+)/)
            let moduleId = moduleMatch?.[1]?.trim()

            // Extract category_id (first word before space/parenthesis)
            const catMatch = body.match(/### 카테고리\s*\n+([^\s(]+)/)
            let categoryId = catMatch?.[1]?.trim()

            // Extract optional description
            const descMatch = body.match(/### 설명 \(선택\)\s*\n+([\s\S]+?)(?:\n###|$)/)
            const description = descMatch?.[1]?.trim()

            // Override from /approve comment.
            // Supported forms (most specific first):
            //   /approve <owner/repo> <moduleId> <categoryId>   ← full override (works with any body format)
            //   /approve <moduleId> <categoryId>                ← module/category override (URL still from body)
            //   /approve                                        ← no override
            const commentBody = context.payload.comment.body ?? ''
            const threeArg = commentBody.match(/\/approve\s+([\w.-]+\/[\w.-]+)\s+(\S+)\s+(\S+)/)
            if (threeArg) {
              githubUrl = `https://github.com/${threeArg[1]}`
              moduleId = threeArg[2]
              categoryId = threeArg[3]
              core.info(`전체 오버라이드: ${githubUrl} | ${moduleId} → ${categoryId}`)
            } else {
              const twoArg = commentBody.match(/\/approve\s+(\S+)\s+(\S+)/)
              if (twoArg) {
                moduleId = twoArg[1]
                categoryId = twoArg[2]
                core.info(`모듈/카테고리 오버라이드: ${moduleId} → ${categoryId}`)
              }
            }

            if (!githubUrl || !moduleId || !categoryId) {
              core.setFailed(`Could not parse issue body. URL: ${githubUrl}, Module: ${moduleId}, Category: ${categoryId}`)
              return
            }

            core.setOutput('github_url', githubUrl)
            core.setOutput('module_id', moduleId)
            core.setOutput('category_id', categoryId)
            core.setOutput('description', description ?? '')

      - name: Validate module-category mapping
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const modules = JSON.parse(fs.readFileSync('data/modules/index.json', 'utf8'))
            const moduleId = '${{ steps.parse.outputs.module_id }}'
            const categoryId = '${{ steps.parse.outputs.category_id }}'

            const mod = modules.modules.find(m => m.id === moduleId)
            if (!mod) {
              core.setFailed(`알 수 없는 모듈: ${moduleId}`)
              return
            }
            if (!mod.categories.includes(categoryId)) {
              core.setFailed(`카테고리 "${categoryId}"는 모듈 "${mod.name}" (${moduleId})에 속하지 않습니다.\n유효한 카테고리: ${mod.categories.join(', ')}`)
              return
            }
            core.info(`${moduleId} -> ${categoryId} 매핑 확인 완료`)

      - name: Add tool to JSON
        id: add_tool
        run: |
          ARGS=(--github-url "$TOOL_GITHUB_URL" --module-id "$TOOL_MODULE_ID" --category-id "$TOOL_CATEGORY_ID")
          if [ -n "$TOOL_DESCRIPTION" ]; then
            ARGS+=(--description "$TOOL_DESCRIPTION")
          fi
          pnpm run add-tool -- "${ARGS[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOOL_GITHUB_URL: ${{ steps.parse.outputs.github_url }}
          TOOL_MODULE_ID: ${{ steps.parse.outputs.module_id }}
          TOOL_CATEGORY_ID: ${{ steps.parse.outputs.category_id }}
          TOOL_DESCRIPTION: ${{ steps.parse.outputs.description }}

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat: add ${{ steps.parse.outputs.github_url }} (closes #${{ github.event.issue.number }})"
          file_pattern: 'data/**/*.json'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Comment success on issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `프로젝트가 성공적으로 추가되었습니다.\n\n` +
                    `- **GitHub URL**: ${{ steps.parse.outputs.github_url }}\n` +
                    `- **모듈**: ${{ steps.parse.outputs.module_id }}\n` +
                    `- **카테고리**: ${{ steps.parse.outputs.category_id }}\n\n` +
                    `다음 빌드 시 [OSS Landscape](https://oss-landscape.pytorch.kr)에 반영됩니다.`
            })
            // Only attempt to close the issue if it is still open.
            // Retried /approve comments on an already-closed issue would otherwise
            // trigger a 422 "Validation Failed" here even though the actual data
            // ingestion succeeded — making the run look like a failure.
            const {data: issue} = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            })
            if (issue.state === 'open') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed'
              })
            } else {
              core.info(`Issue #${context.issue.number} is already closed; skipping state update.`)
            }

      - name: Comment failure on issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `프로젝트 추가에 실패했습니다. [워크플로 로그](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})를 확인해 주세요.\n\n` +
                    `일반적인 원인:\n` +
                    `- 이미 등록된 프로젝트\n` +
                    `- 모듈과 카테고리가 일치하지 않음\n` +
                    `- 비공개 또는 존재하지 않는 저장소`
            })
