name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    # KST 03:00 (UTC 18:00 previous day)
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "build-deploy"
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    outputs:
      refresh_outcome: ${{ steps.refresh.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the commit step can rebase onto a newer main.
          fetch-depth: 0

      # pnpm version comes from package.json "packageManager"
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test data refresh
        run: pnpm test

      - name: Update repository URLs and metadata
        id: refresh
        continue-on-error: true
        run: pnpm run update-stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The add-project workflow can push to main while this job runs.
      # Rebase the metadata commit onto the newer main and retry instead of failing.
      # If the rebase conflicts, skip this refresh. The next run refreshes again.
      - name: Commit repository updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then
            echo "No repository updates to commit"
            exit 0
          fi
          git commit -m 'chore: update repository metadata'
          BRANCH="${{ github.event.repository.default_branch }}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto the latest $BRANCH"
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then
              git rebase --abort
              git reset --hard "origin/$BRANCH"
              echo "::warning::Metadata refresh conflicts with the latest $BRANCH. Skipped this refresh."
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Failed to push repository updates after 3 attempts"
          exit 1

      - name: Build
        run: pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  check-refresh:
    runs-on: ubuntu-latest
    needs: update-and-build
    if: ${{ needs.update-and-build.outputs.refresh_outcome == 'failure' }}
    steps:
      - name: Report incomplete data refresh
        run: |
          echo "::error::Data refresh failed. Successful updates were saved. Read the update-and-build job summary."
          exit 1
